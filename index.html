/* darken edges + dark pond at the bottom */
.shade{
  position:absolute;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(120% 70% at 50% 28%,transparent 30%,rgba(8,10,7,.55) 75%),
    linear-gradient(to bottom,rgba(8,10,7,.25) 0%,transparent 22%,transparent 55%,rgba(10,12,9,.6) 70%,rgba(10,12,9,.82) 100%);
}
/* light rays */
.rays{
  position:absolute;inset:-10% -20% 20%;z-index:-1;pointer-events:none;mix-blend-mode:screen;
  background:
    linear-gradient(104deg,transparent 40%,rgba(255,236,190,.16) 44%,transparent 48%),
    linear-gradient(98deg,transparent 50%,rgba(255,236,190,.12) 53%,transparent 57%),
    linear-gradient(110deg,transparent 30%,rgba(255,236,190,.10) 34%,transparent 39%),
    linear-gradient(94deg,transparent 58%,rgba(255,236,190,.09) 61%,transparent 65%);
  -webkit-mask-image:linear-gradient(#000 20%,transparent 85%);mask-image:linear-gradient(#000 20%,transparent 85%);
  animation:rays 9s ease-in-out infinite alternate;
}
@keyframes rays{from{opacity:.65;transform:translateX(-2%) skewX(-2deg)}to{opacity:1;transform:translateX(2%) skewX(2deg)}}
canvas.dust{position:absolute;inset:0;z-index:0;pointer-events:none}

/* ---------- scene 1: names + envelope + swans ---------- */
.scene1{position:absolute;inset:0;z-index:2;transition:opacity 1.1s ease,filter 1.1s ease}
.scene1.gone{opacity:0;filter:blur(6px);pointer-events:none}
.names{
  position:absolute;top:23.5%;left:0;right:0;text-align:center;direction:ltr;
  font-family:var(--script);font-size:clamp(40px,13.5cqw,72px);color:#f4f0e6;
  text-shadow:0 2px 14px rgba(0,0,0,.45);
  animation:rise 1.8s .2s cubic-bezier(.2,.7,.2,1) both;
}
.envelope{
  position:absolute;left:50%;top:35.5%;width:66cqw;transform:translateX(-50%);
  filter:drop-shadow(0 14px 22px rgba(0,0,0,.45));
  animation:rise 1.8s .5s cubic-bezier(.2,.7,.2,1) both;
}
.envelope svg{display:block;width:100%;height:auto}
.envelope:focus-visible{outline:1px dashed #f1ece0;outline-offset:8px}
.swans{
  position:absolute;left:50%;top:60%;width:56cqw;transform:translateX(-50%);
  display:flex;justify-content:center;gap:2cqw;
  animation:rise 2s .9s ease both;
}
.swans img{width:48%;height:auto;filter:drop-shadow(0 0 10px rgba(255,250,235,.15))}
.swans img:first-child{transform:scaleX(-1)}
.swans img:first-child{animation:bobL 6s ease-in-out infinite}
.swans img:last-child{animation:bob 6s .6s ease-in-out infinite}
@keyframes bob{50%{translate:0 2px}}
@keyframes bobL{50%{translate:0 2px}}
.hint{
  position:absolute;left:0;right:0;top:84%;text-align:center;
  font-size:15px;color:rgba(241,236,224,.75);letter-spacing:.02em;
  animation:rise 1.5s 2s ease both, breathe 2.8s 3.5s ease-in-out infinite;
}
@keyframes rise{from{opacity:0;transform:translate(var(--tx,0),18px)}}
.envelope,.swans{--tx:-50%}
@keyframes breathe{50%{opacity:.4}}

/* ---------- scene 2: lace card ---------- */
.scene2{
  position:absolute;inset:0;z-index:3;display:grid;place-items:center;
  opacity:0;pointer-events:none;transform:scale(.62);
  transition:opacity 1.4s ease,transform 1.9s cubic-bezier(.2,.75,.2,1);
}
.scene2.show{opacity:1;transform:none;pointer-events:auto}
.card{position:relative;width:84cqw;aspect-ratio:400/520;margin-top:-6%}
.card > svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 18px 26px rgba(0,0,0,.5))}
.panel{
  position:absolute;left:13.5%;right:13.5%;top:11.2%;bottom:11.2%;
  background:var(--panel);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:10% 5% 0;text-align:center;overflow:hidden;
}

.panel::after{ /* perforated border */
  content:"";position:absolute;inset:5px;pointer-events:none;
  border:2px dotted rgba(255,255,255,.85);
}
.panel > *{position:relative;z-index:1}
.my{font-family:var(--script);direction:ltr;font-size:clamp(22px,7.6cqw,38px);line-height:1.05;color:#fff}
.couple{font-family:var(--serif);direction:ltr;font-size:clamp(14px,4.6cqw,22px);margin-top:2%;letter-spacing:.02em;opacity:.95}
.line{font-family:var(--ar);font-size:clamp(12px,4.1cqw,20px);line-height:1.7;white-space:nowrap}
.lines{margin-top:8%}
.big{
  font-family:var(--ar);font-size:clamp(24px,8.6cqw,42px);line-height:1.4;margin-top:3%;padding-bottom:.15em;
  display:flex;flex-direction:column;align-items:center;
}
.big span{display:block;white-space:nowrap}
.big span:first-child{padding-left:1.6em}
.big span:last-child{padding-right:1.2em}
.when{font-family:var(--sans);font-weight:300;direction:ltr;font-size:clamp(12px,3.8cqw,18px);letter-spacing:.08em;margin-top:auto}
.where{
  font-family:var(--serif);direction:ltr;font-size:clamp(11px,3.6cqw,17px);letter-spacing:.08em;
  display:inline-flex;align-items:center;gap:.4em;margin:2% 0 14%;
}
.where svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.5}
.where:focus-visible{outline:1px dashed #fff;outline-offset:4px}

.scroller{
  position:absolute;inset:0;z-index:3;overflow-y:hidden;overflow-x:hidden;
  scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.scroller::-webkit-scrollbar{display:none}
.scroller.unlocked{overflow-y:auto}
/* scroll-driven "stories": the card stays pinned while the info appears */
.story{position:relative;height:calc(100% * var(--n))}
.sticky{position:sticky;top:0;height:calc(100% / var(--n));display:grid;place-items:center;overflow:hidden}
.story .card{opacity:0;transform:scale(.8);transition:opacity 1.2s ease,transform 1.7s cubic-bezier(.2,.75,.2,1)}
.story.play .card{opacity:1;transform:none}
.cue.fade{transform:none}
.intro{position:relative;height:100%;min-height:560px}
.intro .scene1,.intro .scene2{position:absolute;inset:0}
.cue{
  position:absolute;left:0;right:0;bottom:4%;text-align:center;font-size:14px;color:rgba(241,236,224,.8);
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.cue svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;animation:nudge 2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(5px)}}

/* ---------- location section ---------- */
.loc .sticky{padding-bottom:2%}
.loc .card{aspect-ratio:400/560}
.loc .panel{padding:10% 7% 0;justify-content:flex-start}
.loc-title{font-family:var(--ar);font-size:clamp(20px,6.6cqw,32px);line-height:1.5}
.loc-sub{font-family:var(--script);direction:ltr;font-size:clamp(16px,5cqw,26px);opacity:.9;margin-top:-1%}
.loc-venue{font-family:var(--serif);direction:ltr;font-size:clamp(13px,4.2cqw,20px);letter-spacing:.12em;margin-top:5%}
.loc-addr{font-family:var(--ar);font-size:clamp(12px,3.7cqw,18px);opacity:.9;line-height:1.7;margin-top:1%}
.map{
  display:block;width:100%;margin-top:6%;aspect-ratio:16/9;border:1px solid rgba(255,255,255,.55);
  position:relative;overflow:hidden;background:rgba(255,255,255,.06);
}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.pin{transform-box:fill-box;transform-origin:50% 100%}
.loc.in .pin{animation:drop .9s .4s cubic-bezier(.3,1.4,.5,1) both}
@keyframes drop{from{transform:translateY(-60px);opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s 1.3s ease-out infinite;opacity:0}
@keyframes pulse{from{transform:scale(.4);opacity:.8}to{transform:scale(2.6);opacity:0}}
.loc-time{font-family:var(--sans);font-weight:300;direction:ltr;font-size:clamp(12px,3.6cqw,17px);letter-spacing:.08em;margin-top:5%}
.btn{
  display:inline-flex;align-items:center;gap:.5em;margin:5% 0 0;padding:.65em 1.4em;
  border:1px solid rgba(255,255,255,.85);font-family:var(--ar);font-size:clamp(13px,3.9cqw,18px);
  transition:background .3s ease,color .3s ease;
}
.btn svg{width:1.05em;height:1.05em;fill:none;stroke:currentColor;stroke-width:1.5}
.btn:hover{background:#fff;color:#5c5954}
.btn:focus-visible{outline:1px dashed #fff;outline-offset:4px}

.thanks{font-family:var(--script);direction:ltr;text-align:center;font-size:clamp(26px,9cqw,44px);color:#f4f0e6;padding:6% 0 40%;text-shadow:0 2px 14px rgba(0,0,0,.5)}
/* ---------- countdown ---------- */
.count .card{aspect-ratio:400/330}
.count .panel{justify-content:center;padding:0 5%}
.cd-title{font-family:var(--ar);font-size:clamp(17px,5.4cqw,26px)}
.cd{display:flex;justify-content:center;gap:3.2cqw;margin-top:6%}
.cd div{display:flex;flex-direction:column;align-items:center;min-width:11cqw}
.cd b{font-family:var(--serif);font-weight:400;font-size:clamp(24px,8.6cqw,42px);line-height:1;font-variant-numeric:lining-nums tabular-nums}
.cd span{font-family:var(--ar);font-size:clamp(11px,3.2cqw,15px);opacity:.85;margin-top:6px}


/* envelope opening */
.envelope svg{overflow:visible}
.flap{transform-box:fill-box;transform-origin:50% 3%;transition:transform 1.1s cubic-bezier(.55,.05,.3,1)}
.scene1.opened .flap{transform:scaleY(-1)}
.pearl{transition:opacity .4s ease}
.scene1.opened .pearl{opacity:0}
.scene1.opened .envelope{cursor:default}
.letter{opacity:0;transition:opacity .3s .5s ease,transform 1.3s .75s cubic-bezier(.2,.75,.2,1)}
.scene1.opened .letter{opacity:1;transform:translateY(-84px)}
.names{transition:top 1.1s cubic-bezier(.55,.05,.3,1)}
.scene1.opened .names{top:6%}
.hint{
  position:absolute;left:0;right:0;top:84%;text-align:center;
  font-size:15px;color:rgba(241,236,224,.75);
  animation:rise 1.5s 1.6s ease both, breathe 2.8s 3.1s ease-in-out infinite;transition:opacity .5s ease;
}
@keyframes breathe{50%{opacity:.4}}
.scene1.opened .hint{opacity:0;animation:none}

/* reveal states */
.fade{opacity:0;transform:translateY(14px);transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.2,.75,.2,1)}
.fade.on{opacity:1;transform:none}
/* handwriting-style wipe, right to left */
.write{
  -webkit-mask-image:linear-gradient(to left,#000 40%,transparent 60%);mask-image:linear-gradient(to left,#000 40%,transparent 60%);
  -webkit-mask-size:250% 100%;mask-size:250% 100%;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:0% 0;mask-position:0% 0;
  transition:-webkit-mask-position var(--d,2.2s) linear,mask-position var(--d,2.2s) linear;
}
.write.on{-webkit-mask-position:100% 0;mask-position:100% 0}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<main class="stage">
  <div class="bg" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>
  <div class="rays" aria-hidden="true"></div>
  <canvas class="dust" aria-hidden="true"></canvas>

  <div class="scroller" id="scroller">
  <section class="intro" id="intro">
  <!-- Scene 1 -->
  <section class="scene1" id="scene1">
    <h1 class="names" id="namesTop">Seif &amp; Nada</h1>

<script>
/* ================= عدّل بيانات الدعوة هنا ================= */
const CONFIG = {
  names:  'Seif & Nada',
  line1:  'إلى كل من نال في قلبي مكان عزيز',
  line2:  'بكل ود وحب أدعوكم لحضور',
  date:   '15 . 10 . 2026',
  venue:  'WEDDING HALL',
  address:'طنطا، الغربية',
  time:   '8:00 PM',
  countdownTo: '2026-10-15T20:00:00+03:00',   // ميعاد الحفلة للعدّاد (توقيت مصر)
  mapUrl: 'https://maps.google.com/?q=30.780298,30.974554',
  autoOpenAfter: 0       // الظرف مش هيتفتح غير لما حد يضغط عليه
};

document.getElementById('namesTop').textContent = CONFIG.names;
document.getElementById('namesCard').textContent = CONFIG.names;
document.getElementById('l1').textContent = CONFIG.line1;
document.getElementById('l2').textContent = CONFIG.line2;
document.getElementById('when').textContent = CONFIG.date;
document.getElementById('venue').textContent = CONFIG.venue;
document.getElementById('where').href = CONFIG.mapUrl;
document.getElementById('locVenue').textContent = CONFIG.venue;
document.getElementById('locAddr').textContent = CONFIG.address;
document.getElementById('locTime').textContent = CONFIG.date + '  ·  ' + CONFIG.time;
document.getElementById('mapBox').href = CONFIG.mapUrl;
document.getElementById('mapBtn').href = CONFIG.mapUrl;
document.getElementById('thanks').textContent = 'With love, ' + CONFIG.names;

const NS = 'http://www.w3.org/2000/svg';
const f = n => +n.toFixed(1);

/* ================= Envelope (cream paper + lace-trimmed flap + pearl) ================= */
function envelopeSVG(){
  const W = 380, H = 236, tipY = 150;
  // lace scallops along both flap edges
  let lace = '', holes = '';
  const edge = (x1,y1,x2,y2) => {
    const len = Math.hypot(x2-x1,y2-y1), n = Math.floor(len/9);
    const ux=(x2-x1)/len, uy=(y2-y1)/len, nx=-uy, ny=ux; // normal
    for(let i=0;i<=n;i++){
      const t=i/n, x=x1+(x2-x1)*t, y=y1+(y2-y1)*t;
      // scallop below the edge (outside flap)
      const sx = x + nx*(nx<0?-1:1)*0, sy = y;
      lace += `<circle cx="${f(x - nx*3*Math.sign(ny||1))}" cy="${f(y - ny*3*Math.sign(ny||1))}" r="5.6"/>`;
      if(i%2===0) holes += `<circle cx="${f(x + nx*7*Math.sign(-ny||1))}" cy="${f(y + ny*7*Math.sign(-ny||1))}" r="1.5"/>`;
      if(i%3===1) holes += `<path d="M${f(x+nx*13*Math.sign(-ny||1))} ${f(y+ny*13*Math.sign(-ny||1))} m-3 0 q3 -5 6 0 q-3 5 -6 0z"/>`;
    }
  };
  edge(0,0,W/2,tipY); edge(W,0,W/2,tipY);
  return `<svg viewBox="-8 -4 ${W+16} ${H+12}" xmlns="${NS}">
  <defs>
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .52  0 0 0 0 .45  0 0 0 .14 0"/><feComposite in2="SourceGraphic" operator="in"/><feBlend in2="SourceGraphic" mode="multiply"/></filter>
    <pattern id="weave" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 4L4 0" stroke="#d8d2c2" stroke-width=".5"/></pattern>
    <radialGradient id="pearl" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#ede8dc"/><stop offset="1" stop-color="#b9b1a0"/></radialGradient>
    <filter id="flapShadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5d5444" flood-opacity=".28"/></filter>
  </defs>
  <rect x="0" y="0" width="${W}" height="${H}" rx="2" fill="#e9e5d8"/>
  <g class="letter">
    <rect x="24" y="12" width="${W-48}" height="${H-30}" fill="#8f8b86"/>
    <rect x="30" y="18" width="${W-60}" height="${H-42}" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray=".1 4" stroke-linecap="round"/>
    <text x="${W/2}" y="62" text-anchor="middle" font-family="Pinyon Script, cursive" font-size="26" fill="#fff">My engagement</text>
  </g>
  <g class="pocket">
    <path d="M0 ${H*.4} L${W/2} ${H*.72} L${W} ${H*.4} V${H} H0 Z" fill="#eeebdf" filter="url(#paper)"/>
    <path d="M0 ${H*.4} L${W/2} ${H*.72} L${W} ${H*.4} V${H} H0 Z" fill="url(#weave)" opacity=".5"/>
    <path d="M0 ${H*.4} L${W/2} ${H*.72} L${W} ${H*.4}" fill="none" stroke="#d6cfbd" stroke-width=".9"/>
  </g>
  <g class="flap"><g filter="url(#flapShadow)">
    <g fill="#f6f3ea" stroke="#d6cdb8" stroke-width=".7">${lace}</g>
    <path d="M0 0 H${W} L${W/2} ${tipY} Z" fill="#f2efe5"/>
    <path d="M0 0 H${W} L${W/2} ${tipY} Z" fill="url(#weave)" opacity=".45"/>
  </g>
  <g fill="none" stroke="#d3cab4" stroke-width=".7">${holes}</g></g>
  <g class="pearl"><g transform="translate(${W/2} ${tipY+4})">
    <path d="M0 -12 C 6 -4 8 2 8 6 A8 8 0 0 1 -8 6 C -8 2 -6 -4 0 -12Z" fill="url(#pearl)" stroke="#c9c1ae" stroke-width=".5"/>
    <ellipse cx="-2.5" cy="0" rx="2" ry="3" fill="#fff" opacity=".85"/>
  </g></g>
</svg>`;
}
document.getElementById('envelope').innerHTML = envelopeSVG();

/* ================= Lace doily frame ================= */
function laceSVG(W=400,H=520){
  const inset=26, path=[], N=360;
  // walk a rounded rectangle, pushed outward in soft waves -> doily silhouette
  const pts=[];
  const rx=W/2-inset, ry=H/2-inset;
  for(let i=0;i<N;i++){
    const a=i/N*Math.PI*2, c=Math.cos(a), s=Math.sin(a);
    // superellipse (squarish)
    const e=.2, x=Math.sign(c)*Math.pow(Math.abs(c),e)*rx, y=Math.sign(s)*Math.pow(Math.abs(s),e)*ry;
    const wave = 1 + .045*Math.abs(Math.sin(a*4)) + .018*Math.abs(Math.sin(a*12));
    pts.push([W/2+x*wave, H/2+y*wave]);
  }
  // resample evenly
  const even=[]; let acc=0, step=15.5;
  for(let i=0;i<pts.length;i++){
    const [x1,y1]=pts[i],[x2,y2]=pts[(i+1)%pts.length], d=Math.hypot(x2-x1,y2-y1);
    let t=0; while(acc+d*(1-t)>=step){ t+= (step-acc)/d; even.push([x1+(x2-x1)*t,y1+(y2-y1)*t]); acc=0; }
    acc+=d*(1-t);
  }
  const poly = 'M'+pts.map(p=>p.map(f).join(' ')).join('L')+'Z';
  let scallops='', eyelets='', ring2='', petals='';
  even.forEach(([x,y],i)=>{
    scallops+=`<circle cx="${f(x)}" cy="${f(y)}" r="9"/>`;
    eyelets+=`<circle cx="${f(x)}" cy="${f(y)}" r="2.6"/>`;
    // inward points
    const dx=W/2-x, dy=H/2-y, L=Math.hypot(dx,dy), nx=dx/L, ny=dy/L;
    if(i%2===0) ring2+=`<circle cx="${f(x+nx*14)}" cy="${f(y+ny*14)}" r="3.4"/>`;
    const px=x+nx*28, py=y+ny*28, ang=Math.atan2(ny,nx)*180/Math.PI+90;
    if(i%3===0) petals+=`<g transform="translate(${f(px)} ${f(py)}) rotate(${f(ang)})"><path d="M0 -9 C5 -5 5 4 0 7 C-5 4 -5 -5 0 -9Z"/><circle r="1.6" cy="-1"/></g>`;
    else petals+=`<circle cx="${f(px)}" cy="${f(py)}" r="1.3"/>`;
  });
  return `
  <defs>
    <filter id="lt"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="9"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .46  0 0 0 0 .38  0 0 0 .18 0"/><feComposite in2="SourceGraphic" operator="in"/><feBlend in2="SourceGraphic" mode="multiply"/></filter>
    <pattern id="mesh" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.25" fill="none" stroke="#cbbfa5" stroke-width=".6"/></pattern>
    <radialGradient id="lglow" cx=".5" cy=".45" r=".7"><stop offset=".6" stop-color="#f3eee2"/><stop offset="1" stop-color="#e2d9c4"/></radialGradient>
  </defs>
  <g filter="url(#lt)">
    <g fill="#efe9db">${scallops}</g>
    <path d="${poly}" fill="url(#lglow)"/>
  </g>
  <path d="${poly}" fill="url(#mesh)" opacity=".75"/>
  <g fill="#bfae8a" opacity=".9">${eyelets}</g>
  <g fill="none" stroke="#b9a984" stroke-width=".9">${ring2}</g>
  <g fill="none" stroke="#b3a27c" stroke-width="1">${petals}</g>
  <rect x="50" y="54" width="${W-100}" height="${H-108}" fill="none" stroke="#d5cab1" stroke-width="5" stroke-dasharray="1 4" stroke-linecap="round"/>`;
}
document.getElementById('lace').innerHTML = laceSVG();
const laceCopy=(W,H,s)=>laceSVG(W,H).replace(/id="(lt|mesh|lglow)"/g,'id="$1'+s+'"').replace(/url\(#(lt|mesh|lglow)\)/g,'url(#$1'+s+')');
document.getElementById('lace2').innerHTML = laceCopy(400,560,'b');
document.getElementById('lace3').innerHTML = laceCopy(400,330,'c');

/* ================= Dust motes in the light ================= */
(function dust(){
  const cv=document.querySelector('.dust'), ctx=cv.getContext('2d');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let w,h,ps=[];
  const size=()=>{const r=cv.getBoundingClientRect(); w=cv.width=r.width*devicePixelRatio; h=cv.height=r.height*devicePixelRatio;};
  size(); addEventListener('resize',size);
  for(let i=0;i<38;i++) ps.push({x:Math.random(),y:Math.random()*.75,r:Math.random()*1.4+.4,v:Math.random()*.00025+.00008,p:Math.random()*6});
  (function loop(t){
    ctx.clearRect(0,0,w,h);
    ps.forEach(o=>{ o.y-=o.v; o.x+=Math.sin(t/3000+o.p)*.00015; if(o.y<0){o.y=.75;o.x=Math.random();}
      const a=.25+.35*Math.sin(t/900+o.p*3)**2;
      ctx.fillStyle=`rgba(255,240,205,${a})`; ctx.beginPath(); ctx.arc(o.x*w,o.y*h,o.r*devicePixelRatio,0,7); ctx.fill(); });
    requestAnimationFrame(loop);
  })(0);
})();

/* ================= Sequence ================= */
const scene1=document.getElementById('scene1'), scene2=document.getElementById('scene2');
const steps=[...document.querySelectorAll('[data-step]'), document.getElementById('cue')];
// timing (ms after the card appears) — matches the video's pacing
const timeline=[1600, 2300, 3200, 5600, 8000, 10800, 11400, 12400];
let opened=false;
function openInvite(){
  if(opened) return; opened=true;
  scene1.classList.add('opened');                                   // 1) flap opens, card rises out
  setTimeout(()=>{const svg=document.querySelector('.envelope svg'); svg.insertBefore(svg.querySelector('.flap'), svg.querySelector('.letter'));}, 560);
  const open=2400;                                                  // 2) then it dissolves into the lace card, like the video
  setTimeout(()=>scene1.classList.add('gone'), open);
  setTimeout(()=>scene2.classList.add('show'), open+150);
  steps.forEach((el,i)=>setTimeout(()=>el.classList.add('on'), open+500+timeline[i]));
  setTimeout(()=>scroller.classList.add('unlocked'), open+500+timeline[timeline.length-1]);
}
document.getElementById('envelope').addEventListener('click', openInvite);
if(CONFIG.autoOpenAfter) setTimeout(openInvite, CONFIG.autoOpenAfter);

/* ================= the rest of the details: each card plays as it scrolls into view ================= */
const scroller=document.getElementById('scroller');
const $=id=>document.getElementById(id);
const loc=$('loc'), count=$('count');
const sequences=new Map([
  [loc,[[document.querySelector('.loc-title'),600],[$('locVenue'),1100],[$('locAddr'),1500],[$('mapBox'),2000],[$('locTime'),3200],[$('mapBtn'),3700]]],
  [count,[[document.querySelector('.cd-title'),600],[$('cdBox'),1200],[$('thanks'),2200]]],
]);
function play(sec){
  if(sec.classList.contains('play')) return;
  sec.classList.add('play');
  sequences.get(sec).forEach(([el,ms])=>setTimeout(()=>el.classList.add('on'),ms));
  if(sec===loc) setTimeout(()=>loc.classList.add('in'),2400);
}
const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) play(e.target); }),{root:scroller,threshold:.45});
[loc,count].forEach(s=>io.observe(s));
$('cue').addEventListener('click',()=>loc.scrollIntoView({behavior:'smooth'}));

/* countdown */
const target=new Date(CONFIG.countdownTo).getTime(), pad=n=>String(n).padStart(2,'0');
function tick(){
  let s=Math.max(0,Math.floor((target-Date.now())/1000));
  $('cd-d').textContent=pad(Math.floor(s/86400)); $('cd-h').textContent=pad(Math.floor(s%86400/3600));
  $('cd-m').textContent=pad(Math.floor(s%3600/60)); $('cd-s').textContent=pad(s%60);
}
tick(); setInterval(tick,1000);
</script>
